_subdirectory: template
_templates_suffix: .jinja
_min_copier_version: "9.0"
_answers_file: .copier-answers.yml
_preserve_symlinks: true

_exclude:
  # Conditional docs
  - "{% if not is_service %}docs/operations.md{% endif %}"
  # Python project files: root layout lives at the project root,
  # component layout lives under {{ component_dir }}/.
  # Only one set is rendered depending on the python variable.
  - "{% if python != 'root' %}/pyproject.toml{% endif %}"
  - "{% if python != 'root' %}/.python-version{% endif %}"
  - "{% if python != 'root' %}/src{% endif %}"
  - "{% if python != 'root' %}/tests{% endif %}"
  - "{% if python != 'component' %}{{ component_dir }}{% endif %}"
  # Conditional CI/CD platforms
  - "{% if platform == 'github' %}.forgejo{% endif %}"
  - "{% if platform == 'forgejo' %}.github{% endif %}"
  # Conditional CD (only if is_service)
  - "{% if not is_service %}.forgejo/workflows/cd.yml{% endif %}"
  - "{% if not is_service %}.github/workflows/cd.yml{% endif %}"
  # Agent adapters
  - "{% if 'claude' not in agents %}CLAUDE.md{% endif %}"
  - "{% if 'claude' not in agents %}.claude{% endif %}"
  - "{% if 'codex' not in agents %}.codex{% endif %}"
  # Conditional pre-commit
  - "{% if hooks == 'none' %}.pre-commit-config.yaml{% endif %}"
  # Conditional Dockerfile (only if is_service)
  - "{% if not is_service %}Dockerfile{% endif %}"
  # Conditional secrets example (only if env-only)
  - "{% if secrets != 'env-only' %}.env.example{% endif %}"

_message_after_copy: |
  Project "{{ project_name }}" created. Next steps:

    git init && git add -A && git commit -m "chore: initial project setup"
  {%- if python == 'root' %}
    uv sync
    git add uv.lock && git commit -m "chore: lock dependencies"
  {%- elif python == 'component' %}
    cd {{ component_dir }} && uv sync && cd ..
    git add {{ component_dir }}/uv.lock && git commit -m "chore: lock dependencies"
  {%- endif %}
  {%- if hooks != 'none' %}
    pre-commit install
  {%- endif %}
  {%- if platform == 'github' %}
    git remote add origin https://github.com/{{ org }}/{{ project_name }}.git
  {%- elif platform == 'forgejo' %}
    git remote add origin {{ forgejo_url }}/{{ org }}/{{ project_name }}.git
  {%- else %}
    git remote add origin {{ forgejo_url }}/{{ org }}/{{ project_name }}.git
    git remote add github https://github.com/{{ org }}/{{ project_name }}.git
  {%- endif %}
    git push -u origin main
    just labels-init

  Then make the merge gate hold on the forge (see docs/workflow.md, "Enforcement"):
  {%- if platform == 'github' %}
    just forge-protect     # main: pull requests only, one approving review (non-admins)
  {%- else %}
    Protect main by hand — fj cannot do it: Settings → Branches → Add new rule,
    pattern "main", disable push, required approvals 1.
  {%- endif %}
    Give agents their own account or token with write access but without admin
    or merge rights.

  On another machine or in a cloud agent environment: scripts/setup.sh
  {%- if platform == 'both' %}
    git push github main
  {%- endif %}

# ── Questions ─────────────────────────────────────────────────────────────────

project_name:
  type: str
  help: Project name (used in headings and as the default package name)

author_name:
  type: str
  help: Author name (optional, leave blank to omit)
  default: ""

platform:
  type: str
  help: "Target platform: forgejo, github, or both"
  choices:
    - forgejo
    - github
    - both
  default: forgejo

forgejo_url:
  type: str
  help: "Forgejo instance URL, e.g. https://codeberg.org (no trailing slash)"
  when: "{{ platform != 'github' }}"
  default: ""

org:
  type: str
  help: "GitHub/Forgejo organization or username (used in remote URLs)"
  default: ""

github_owner_type:
  type: str
  help: "Is that GitHub owner an organization or a personal account? Organizations have native issue types; personal accounts get type/ labels instead"
  choices:
    - personal
    - organization
  default: personal
  when: "{{ platform == 'github' }}"

python:
  type: str
  help: "Python layout: root (project at the repo root) or component (under backend/)"
  choices:
    - root
    - component
  default: root

python_version:
  type: str
  help: Python version
  choices:
    - "3.14"
    - "3.13"
    - "3.12"
  default: "3.14"

is_service:
  type: bool
  help: "Does this project run as a long-running service? (adds Dockerfile, operations.md, CD pipeline)"
  default: false

license:
  type: str
  help: License
  choices:
    - mit
    - agpl
    - proprietary
    - none
  default: mit

secrets:
  type: str
  help: "Secrets management: sops (encrypted files in repo), env-only (.env files), or none"
  choices:
    - sops
    - env-only
    - none
  default: none

hooks:
  type: str
  help: "Pre-commit hooks: minimal (whitespace/yaml/size), python (adds ruff), or none"
  choices:
    - minimal
    - python
    - none
  default: minimal

component_dir:
  type: str
  help: "Subdirectory name for the Python component (only when python=component)"
  default: "backend"
  when: "{{ python == 'component' }}"

agents:
  type: str
  help: "Agent tools to generate adapters for (deny rules, hooks, skill discovery). AGENTS.md and .agents/skills are always generated"
  multiselect: true
  choices:
    - claude
    - codex
  default: [claude]

# ── Computed variables (never asked) ──────────────────────────────────────────

package_name:
  type: str
  help: Python package name (snake_case of project_name)
  default: "{{ project_name | lower | replace('-', '_') | replace(' ', '_') | replace('.', '_') }}"
  when: false
